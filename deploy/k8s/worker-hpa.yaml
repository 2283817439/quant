apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: quant-worker
  labels:
    app.kubernetes.io/name: quant-worker
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: quant-worker
  minReplicas: 2
  maxReplicas: 20
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 120
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60
  metrics:
    - type: External
      external:
        metric:
          name: quant_task_queue_backlog
          selector:
            matchLabels:
              app: quant
        target:
          type: AverageValue
          averageValue: "10"
